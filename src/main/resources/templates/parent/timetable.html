<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Child's Timetable · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('timetable')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Child's Timetable</h1>
                <p>Read-only weekly schedule for each of your children.</p>
            </div>
            <a th:if="${children != null and not #lists.isEmpty(children)}" th:href="@{/parent/assignments}" class="btn btn-outline"><i class="bi bi-file-earmark-text-fill"></i> Assignments</a>
        </div>

        <div th:if="${notice}" class="card"><div class="empty-state"><i class="bi bi-inbox"></i> <span th:text="${notice}">Notice</span></div></div>
        <div th:if="${children != null and #lists.isEmpty(children)}" class="card">
            <div class="empty-state"><i class="bi bi-inbox"></i> No children are linked to your account yet.</div>
        </div>

        <div th:each="c : ${children}" class="card" style="overflow-x:auto; margin-bottom:18px;">
            <h3><i class="bi bi-person-vcard-fill"></i> <span th:text="${c.user.fullName}">Child</span> &mdash; <span th:text="${c.className}">Class</span></h3>
            <div th:replace="~{layout/timetable-grid :: readonly(${grids.get(c.studentId)}, ${periods}, ${days})}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
