<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Child's Results · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('academic')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Child's Results</h1>
                <p>Your child's report card for the selected term.</p>
            </div>
            <th:block th:if="${terms != null and not #lists.isEmpty(terms)}"><div th:replace="~{layout/report-card :: termPicker(${terms}, ${selectedTermId})}"></div></th:block>
        </div>

        <div th:if="${notice}" class="card"><div class="empty-state"><i class="bi bi-inbox"></i> <span th:text="${notice}">Notice</span></div></div>
        <div th:if="${children != null and #lists.isEmpty(children)}" class="card">
            <div class="empty-state"><i class="bi bi-inbox"></i> No children are linked to your account yet.</div>
        </div>

        <div th:each="c : ${children}" class="card" style="margin-bottom:18px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
            <h3 style="margin:0;"><i class="bi bi-person-vcard-fill"></i> <span th:text="${c.student().user.fullName}">Child</span>
                &nbsp;<span class="id-badge" th:text="${c.student().studentId}">S2600001</span></h3>
                <a th:href="@{/parent/child-results/{id}/pdf(id=${c.student().studentId}, termId=${selectedTermId})}" class="btn btn-primary"><i class="bi bi-file-earmark-pdf-fill"></i> Export PDF</a>
            </div>

            <div th:replace="~{layout/report-card :: view(${c.reportCard()})}"></div>

            <div th:if="${#lists.size(c.trend()) > 1}" style="margin-top:18px;">
                <h4 style="color:var(--navy); margin:0 0 10px;">Average Mark by Term</h4>
                <canvas th:id="'trend-' + ${c.student().studentId}" height="90"></canvas>
                <script th:inline="javascript">
                    (function () {
                        var trend = /*[[${c.trend()}]]*/ [];
                        var ctx = document.getElementById('trend-' + /*[[${c.student().studentId}]]*/ '');
                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: trend.map(function (t) { return t.label; }),
                                datasets: [{
                                    label: 'Average mark',
                                    data: trend.map(function (t) { return t.average; }),
                                    borderColor: '#F1851F',
                                    backgroundColor: 'rgba(241,133,31,0.15)',
                                    tension: 0.3,
                                    fill: true
                                }]
                            },
                            options: {
                                scales: { y: { min: 0, max: 100, ticks: { stepSize: 20 } } },
                                plugins: { legend: { display: false } }
                            }
                        });
                    })();
                </script>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
