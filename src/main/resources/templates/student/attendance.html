<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Attendance · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('attendance')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>My Attendance</h1>
            <p>Your full history. Attendance % counts present days only (late and absent count as 0).</p>
        </div>

        <div th:if="${notice}" class="card"><div class="empty-state"><i class="bi bi-inbox"></i> <span th:text="${notice}">Notice</span></div></div>
        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div th:if="${summary}" class="grid grid-3" style="margin-bottom:20px;">
            <div class="card stat-card">
                <div class="stat-icon"><i class="bi bi-percent"></i></div>
                <div class="stat-value" th:text="${summary.percentage() != null} ? ${#numbers.formatDecimal(summary.percentage(),1,1)} + '%' : '—'">—</div>
                <div class="stat-label">Attendance %</div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon"><i class="bi bi-calendar2-check-fill"></i></div>
                <div class="stat-value" th:text="${summary.presentDays()}">0</div>
                <div class="stat-label">Present Days</div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon"><i class="bi bi-calendar2-x-fill"></i></div>
                <div class="stat-value" th:text="${summary.absentDays()}">0</div>
                <div class="stat-label">Absent Days</div>
            </div>
        </div>

        <div th:if="${records != null}" class="card" style="margin-bottom:18px;">
            <table class="wsims-table">
                <thead>
                <tr><th>Date</th><th>Status</th><th>Marked By</th><th>Last Edited</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${records}">
                    <td th:text="${r.attendanceDate}">2026-01-01</td>
                    <td><span class="status" th:classappend="${#strings.toLowerCase(r.status)}" th:text="${r.status}">STATUS</span></td>
                    <td th:text="${r.markedBy}">T2600001</td>
                    <td th:text="${r.lastEditedAt != null} ? ${r.lastEditedBy} : '—'">—</td>
                </tr>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="4"><div class="empty-state"><i class="bi bi-inbox"></i> No attendance recorded yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
