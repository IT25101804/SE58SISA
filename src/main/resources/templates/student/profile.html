<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Profile · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('students')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>My Student Profile</h1>
            <p>Read-only &mdash; contact the Registrar to update any of these details.</p>
        </div>

        <div th:if="${notice}" class="card"><div class="empty-state"><i class="bi bi-inbox"></i> <span th:text="${notice}">Notice</span></div></div>

        <div th:if="${student}" class="grid grid-2">
            <div class="card">
                <h3><i class="bi bi-person-vcard-fill"></i> Student Details</h3>
                <p><span class="id-badge" th:text="${student.studentId}">S2600001</span>
                    &nbsp;<span class="status" th:classappend="${#strings.toLowerCase(student.status)}" th:text="${student.status}">STATUS</span></p>
                <div class="field"><label>Full Name</label><input type="text" th:value="${student.user.fullName}" disabled/></div>
                <div class="field"><label>Email</label><input type="text" th:value="${student.user.email}" disabled/></div>
                <div class="field"><label>Date of Birth</label><input type="text" th:value="${student.dateOfBirth}" disabled/></div>
                <div class="field"><label>Gender</label><input type="text" th:value="${student.gender}" disabled/></div>
                <div class="field"><label>Class</label><input type="text" th:value="${student.className}" disabled/></div>
                <div class="field"><label>Admission Year</label><input type="text" th:value="${student.admissionYear}" disabled/></div>
                <div class="field"><label>Enrolled</label><input type="text" th:value="${student.enrollmentDate}" disabled/></div>
            </div>
            <div class="card">
                <h3><i class="bi bi-info-circle-fill"></i> Other Details</h3>
                <div class="field"><label>Address</label><input type="text" th:value="${student.address}" disabled/></div>
                <div class="field"><label>Emergency Contact</label><input type="text" th:value="${student.emergencyContact}" disabled/></div>
                <div class="field"><label>Guardian</label><input type="text" th:value="${student.guardianName}" disabled/></div>
                <div class="field"><label>Guardian Contact</label><input type="text" th:value="${student.guardianContact}" disabled/></div>
                <div class="empty-state" style="padding:20px 0;">
                    <i class="bi bi-inbox"></i> Attendance and exam history will appear here once those modules are built.
                </div>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
