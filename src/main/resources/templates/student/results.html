<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Results · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('academic')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>My Results</h1>
                <p>Your report card for the selected term.</p>
            </div>
            <div th:if="${reportCard != null}" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <th:block th:if="${not #lists.isEmpty(terms)}"><div th:replace="~{layout/report-card :: termPicker(${terms}, ${selectedTermId})}"></div></th:block>
                <a th:href="@{/student/results/pdf(termId=${selectedTermId})}" class="btn btn-primary"><i class="bi bi-file-earmark-pdf-fill"></i> Export PDF</a>
            </div>
        </div>

        <div th:if="${notice}" class="card"><div class="empty-state"><i class="bi bi-inbox"></i> <span th:text="${notice}">Notice</span></div></div>

        <div th:if="${reportCard != null}" class="card">
            <div th:replace="~{layout/report-card :: view(${reportCard})}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
