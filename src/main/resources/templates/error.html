<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Something went wrong · WSIMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
  <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
  <style>
    body { background: var(--navy); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .error-card { max-width: 460px; text-align:center; }
  </style>
</head>
<body>
  <div class="card error-card">
    <div class="module-icon" style="margin:0 auto 18px;"><i class="bi bi-signpost-2-fill"></i></div>
    <h2 style="color:var(--navy);" th:text="${status} ?: 'Error'">404</h2>
    <p style="opacity:.7;" th:text="${error} ?: 'That page could not be found.'">Page not found.</p>
    <p><a href="/dashboard" class="btn btn-primary"><i class="bi bi-house-fill"></i> Back to dashboard</a></p>
  </div>
</body>
</html>
