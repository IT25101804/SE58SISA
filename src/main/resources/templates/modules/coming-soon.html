<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${moduleName} + ' · WSIMS'">Module · WSIMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/sidebar :: sidebar(${activeItem})}"></div>
  <div th:replace="~{layout/topbar :: topbar}"></div>
  <div th:replace="~{layout/sidebar :: backdrop}"></div>

  <main class="content">
    <div class="card coming-soon-card">
      <div class="module-icon"><i th:class="'bi ' + ${moduleIcon}"></i></div>
      <h2 th:text="${moduleName}">Module Name</h2>
      <p>This module hasn't been built yet in this checkout &mdash; it's developed on
        its own git branch, with its own AI prompt, so the team can work in parallel.</p>
      <span class="branch-tag" th:text="${branchName}">feature/xx-module-name</span>
      <p>
        <a th:href="@{/dashboard}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
      </p>
    </div>
  </main>
</div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
