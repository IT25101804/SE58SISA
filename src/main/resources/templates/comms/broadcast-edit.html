<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Edit Announcement · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Edit Announcement</h1>
                <p>
                    <span class="status" th:classappend="${#strings.toLowerCase(broadcast.category())}" th:text="${broadcast.category()}">CATEGORY</span>
                    &nbsp;<span th:text="${broadcast.targetScope()}">SCOPE</span>
                    &middot; <span th:text="${broadcast.recipientCount()}">0</span> recipient(s)
                </p>
            </div>
            <a th:href="@{${backUrl}}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back</a>
        </div>

        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <form th:action="@{/comms/broadcasts/{id}/edit(id=${broadcast.broadcastId()})}" method="post">
                <div class="field">
                    <label for="subject">Subject</label>
                    <input id="subject" type="text" name="subject" th:value="${broadcast.subject()}"/>
                </div>
                <div class="field">
                    <label for="body">Message</label>
                    <textarea id="body" name="body" rows="8" maxlength="1000" required th:text="${broadcast.body()}">Body</textarea>
                </div>
                <div class="field" th:if="${broadcast.sentAt() == null}">
                    <label for="scheduledFor">Scheduled For (leave blank to send now)</label>
                    <input id="scheduledFor" type="datetime-local" name="scheduledFor"
                           th:value="${broadcast.scheduledFor() != null} ? ${#temporals.format(broadcast.scheduledFor(), 'yyyy-MM-dd''T''HH:mm')} : ''"/>
                </div>
                <p style="font-size:12.5px; opacity:.65;">The corrected text replaces the original for every recipient, and is shown as unread again.
                    Category and recipients can't be changed &mdash; post a new notice for a different audience.</p>
                <button type="submit" class="btn btn-primary"><i class="bi bi-save-fill"></i> Save Changes</button>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
