<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Notification · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 th:text="${notification.subject != null and notification.subject != ''} ? ${notification.subject} : '(no subject)'">Subject</h1>
                <p>
                    <span class="status" th:classappend="${#strings.toLowerCase(notification.category)}" th:text="${notification.category}">CATEGORY</span>
                    &nbsp;From <span th:text="${notification.senderUserId ?: 'System'}">Sender</span>
                    &middot; <span th:text="${notification.sentAt}">2026-01-01</span>
                </p>
            </div>
            <div style="display:flex; gap:10px;">
                <a th:href="@{/inbox}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back to Inbox</a>
                <form th:action="@{/inbox/{id}/delete(id=${notification.id})}" method="post"
                      onsubmit="return confirm('Delete this notification from your inbox?');">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash-fill"></i> Delete</button>
                </form>
            </div>
        </div>

        <div class="card">
            <p style="white-space:pre-wrap;" th:text="${notification.body}">Body</p>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
