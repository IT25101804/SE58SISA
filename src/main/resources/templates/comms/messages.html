<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Messages · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Messages</h1>
                <p>Direct conversations with teachers, students and parents.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a th:href="@{/inbox}" class="btn btn-outline"><i class="bi bi-inbox-fill"></i> Inbox</a>
                <a th:href="@{/messages/new}" class="btn btn-primary"><i class="bi bi-plus-circle-fill"></i> New Message</a>
            </div>
        </div>

        <div class="card">
            <table class="wsims-table">
                <thead><tr><th></th><th>With</th><th>Last Message</th><th>Sent</th><th></th></tr></thead>
                <tbody>
                <tr th:each="t : ${threads}">
                    <td><span class="status" th:classappend="${t.unreadCount() > 0} ? 'unread' : 'read'" th:text="${t.unreadCount() > 0} ? ${t.unreadCount()} + ' new' : 'Read'">Unread</span></td>
                    <td>
                        <span th:text="${t.partnerName()}">Name</span>
                        &nbsp;<span class="id-badge" th:text="${t.partnerUserId()}">ID</span>
                    </td>
                    <td th:text="${t.lastMessage().body}">Message preview</td>
                    <td th:text="${t.lastMessage().sentAt}">2026-01-01</td>
                    <td><a th:href="@{/messages/{id}(id=${t.partnerUserId()})}" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;"><i class="bi bi-chat-dots-fill"></i> Open</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(threads)}">
                    <td colspan="5"><div class="empty-state"><i class="bi bi-inbox"></i> No conversations yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
