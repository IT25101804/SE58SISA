<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>New Message · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>New Message</h1>
        </div>

        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card" style="max-width:480px;">
            <form th:action="@{/messages/new}" th:object="${form}" method="post">
                <div class="field" th:if="${teacherOptions != null}">
                    <label for="toUserId">Teacher</label>
                    <select id="toUserId" th:field="*{toUserId}" required>
                        <option value="">— Choose a teacher —</option>
                        <option th:each="t : ${teacherOptions}" th:value="${t.userId()}"
                                th:text="${user.role.name() == 'PARENT'}
                                    ? ${t.teacherName() + ' — ' + t.subjects() + ' (' + t.childName() + ', ' + t.className() + ')'}
                                    : ${t.teacherName() + ' — ' + t.subjects()}">Teacher — Subject</option>
                    </select>
                    <p th:if="${#lists.isEmpty(teacherOptions)}" style="font-size:12.5px; opacity:.65; margin-top:6px;"
                       th:text="${user.role.name() == 'PARENT'} ? 'No teachers found for your child\'s class yet.' : 'No teachers found for your class yet.'">
                        No teachers found for your class yet.</p>
                </div>
                <th:block th:if="${teacherClassOptions != null}">
                    <div class="field">
                        <label for="sendTo">Send To</label>
                        <select id="sendTo" name="sendTo">
                            <option value="PRINCIPAL" th:selected="${sendTo == 'PRINCIPAL'}">Principal</option>
                            <option value="CLASS" th:selected="${sendTo == 'CLASS'}" th:if="${not #lists.isEmpty(teacherClassOptions)}">One Class (every student)</option>
                            <option value="STUDENT" th:selected="${sendTo == 'STUDENT'}">One Student</option>
                            <option value="PARENT" th:selected="${sendTo == 'PARENT'}">One Parent</option>
                        </select>
                    </div>
                    <div class="field" data-send-to="CLASS">
                        <label for="className">Class</label>
                        <select id="className" name="className">
                            <option value="">— Choose a class —</option>
                            <option th:each="c : ${teacherClassOptions}" th:value="${c}" th:text="${c}" th:selected="${c == className}">Class</option>
                        </select>
                    </div>
                    <div class="field" data-send-to="STUDENT PARENT">
                        <label for="studentId" id="studentIdLabel">Student ID</label>
                        <input id="studentId" type="text" name="studentId" th:value="${studentId}" placeholder="S2600001"/>
                    </div>
                </th:block>
                <div class="field" th:if="${teacherOptions == null and teacherClassOptions == null}"><label for="toUserId">Recipient User ID</label><input id="toUserId" type="text" th:field="*{toUserId}" placeholder="T2600001" required/></div>
                <div class="field"><label for="body">Message</label><textarea id="body" th:field="*{body}" rows="4" required></textarea></div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i> Send</button>
                <a th:href="@{/messages}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back</a>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
    (function () {
        var sendTo = document.getElementById('sendTo');
        if (!sendTo) return;
        var label = document.getElementById('studentIdLabel');
        function sync() {
            document.querySelectorAll('[data-send-to]').forEach(function (field) {
                var show = field.dataset.sendTo.split(' ').indexOf(sendTo.value) !== -1;
                field.style.display = show ? '' : 'none';
                field.querySelectorAll('input, select').forEach(function (input) {
                    input.disabled = !show;
                    input.required = show;
                });
            });
            label.textContent = sendTo.value === 'PARENT'
                ? 'Student ID (the parent linked to this student gets the message)'
                : 'Student ID';
        }
        sendTo.addEventListener('change', sync);
        sync();
    })();
</script>
</body>
</html>
