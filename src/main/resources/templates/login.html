<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log in &middot; SISA</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
  <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body class="login-body">

<div class="login-overlay"></div>

<div class="login-wrap">
  <div class="login-card">

    <h2>Welcome back</h2>
    <p class="sub">Log in with the ID your school gave you.</p>

    <div th:if="${param.error}" class="login-alert">
      <i class="bi bi-exclamation-circle-fill"></i> Incorrect username or password, or your account isn't approved yet.
    </div>
    <div th:if="${param.logout}" class="login-alert ok">
      <i class="bi bi-check-circle-fill"></i> You've been logged out.
    </div>

    <form th:action="@{/login}" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Enter your ID" required autofocus/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required/>
      </div>
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-box-arrow-in-right"></i> Log in
      </button>
    </form>

  </div>
</div>

<!-- Quick demo-account logins: one small click logs straight in as that role.
     Credentials mirror DataSeeder.java / README.md — keep all three in sync. -->
<div class="demo-quick-login" role="group" aria-label="Demo account quick login">
  <span class="demo-quick-login-label">Demo login</span>
  <button type="button" class="demo-chip demo-chip--principal" data-role="principal" title="Principal demo login &middot; principal">P</button>
  <button type="button" class="demo-chip demo-chip--registrar" data-role="registrar" title="Registrar demo login &middot; R2600001">R</button>
  <button type="button" class="demo-chip demo-chip--teacher" data-role="teacher" title="Teacher demo login &middot; T2600001">T</button>
  <button type="button" class="demo-chip demo-chip--student" data-role="student" title="Student demo login &middot; S2600001">S</button>
  <button type="button" class="demo-chip demo-chip--parent" data-role="parent" title="Parent demo login &middot; P2600001">P</button>
</div>

<script>
  (function () {
    var demoAccounts = {
      principal: { username: 'principal', password: 'Principal@123' },
      registrar: { username: 'R2600001', password: 'Registrar@123' },
      teacher:   { username: 'T2600001', password: 'Teacher@123' },
      student:   { username: 'S2600001', password: 'Student@123' },
      parent:    { username: 'P2600001', password: 'Parent@123' }
    };
    document.querySelectorAll('.demo-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var account = demoAccounts[btn.getAttribute('data-role')];
        var form = document.querySelector('.login-card form');
        if (!account || !form) return;
        document.getElementById('username').value = account.username;
        document.getElementById('password').value = account.password;
        form.submit();
      });
    });
  })();
</script>

</body>
</html>
