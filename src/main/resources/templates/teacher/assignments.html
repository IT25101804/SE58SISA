<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Assignments · SISA</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('timetable')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Assignments</h1>
                <p>Learning material and homework you've posted.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a th:href="@{/teacher/timetable}" class="btn btn-outline"><i class="bi bi-clock-fill"></i> My Timetable</a>
                <a th:href="@{/teacher/assignments/new}" class="btn btn-primary"><i class="bi bi-plus-circle-fill"></i> New Assignment</a>
            </div>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <table class="wsims-table">
                <thead>
                <tr><th>Title</th><th>Class</th><th>Subject</th><th>Due</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${assignments}">
                    <td th:text="${a.title}">Title</td>
                    <td th:text="${a.className}">Class</td>
                    <td th:text="${a.subject}">Subject</td>
                    <td th:text="${a.dueDate}">2026-01-01</td>
                    <td><span class="status" th:classappend="${a.submissionsClosed} ? 'disabled' : 'active'"
                              th:text="${a.submissionsClosed} ? 'Closed' : 'Open'">Open</span></td>
                    <td>
                        <div style="display:flex; gap:6px; flex-wrap:wrap;">
                            <a th:href="@{/teacher/assignments/{id}(id=${a.id})}" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;"><i class="bi bi-eye-fill"></i> View</a>
                            <a th:href="@{/teacher/assignments/{id}/edit(id=${a.id})}" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;"><i class="bi bi-pencil-square"></i> Edit</a>
                            <form th:action="@{/teacher/assignments/{id}/delete(id=${a.id})}" method="post" style="margin:0;"
                                  th:attr="data-confirm=${'Delete this assignment? Any student submissions for it will be removed too.'}">
                                <button type="submit" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;"><i class="bi bi-trash"></i> Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(assignments)}">
                    <td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i> No assignments posted yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
