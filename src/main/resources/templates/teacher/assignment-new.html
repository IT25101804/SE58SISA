<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${editId != null} ? 'Edit Assignment · SISA' : 'New Assignment · SISA'">New Assignment · SISA</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('timetable')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1 th:text="${editId != null} ? 'Edit Assignment' : 'New Assignment'">New Assignment</h1>
            <p th:text="${editId != null} ? 'Update the details of this assignment.' : 'Post learning material or homework for one of your classes.'">Post learning material or homework for one of your classes.</p>
        </div>

        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card" style="max-width:520px;">
            <form th:action="${editId != null} ? @{/teacher/assignments/{id}/edit(id=${editId})} : @{/teacher/assignments/new}" th:object="${form}" method="post">
                <div class="field">
                    <label for="className">Class</label>
                    <select id="className" th:field="*{className}" required>
                        <option value="">Select a class…</option>
                        <option th:each="c : ${classNames}" th:value="${c}" th:text="${c}">Grade 10 - A</option>
                    </select>
                    <p th:if="${#lists.isEmpty(classNames)}" style="font-size:12px; opacity:.65; margin-top:4px;">
                        You aren't assigned to a class yet on the timetable &mdash; ask the Principal to schedule you first.
                    </p>
                </div>
                <div class="field"><label for="subject">Subject</label>
                    <input id="subject" type="text" th:field="*{subject}" readonly placeholder="No subject assigned yet"
                           style="background:var(--azure-soft); cursor:not-allowed;"/>
                    <p th:if="${form.subject == null or form.subject == ''}" style="font-size:12px; opacity:.65; margin-top:4px;">
                        You don't have a subject assigned yet &mdash; ask the Registrar to set your subject specialty.
                    </p>
                </div>
                <div class="field"><label for="title">Title</label><input id="title" type="text" th:field="*{title}" required/></div>
                <div class="field"><label for="description">Description</label><textarea id="description" th:field="*{description}" rows="4"></textarea></div>
                <div class="field"><label for="materialUrl">Material Link / File Reference (optional)</label><input id="materialUrl" type="text" th:field="*{materialUrl}" placeholder="https://…"/></div>
                <div class="field"><label for="dueDate">Due Date</label><input id="dueDate" type="date" th:field="*{dueDate}" required/></div>
                <button th:if="${editId == null}" type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload-fill"></i> Post Assignment</button>
                <button th:if="${editId != null}" type="submit" class="btn btn-primary"><i class="bi bi-save-fill"></i> Save Changes</button>
                <a th:href="@{/teacher/assignments}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back</a>
            </form>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
