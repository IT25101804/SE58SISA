<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Communication · SISA</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Communication</h1>
                <p>Class notices you've posted, and direct messages with parents/students.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a th:href="@{/inbox}" class="btn btn-outline"><i class="bi bi-inbox-fill"></i> Inbox</a>
                <a th:href="@{/messages}" class="btn btn-outline"><i class="bi bi-chat-dots-fill"></i> Messages</a>
                <a th:if="${teacher != null and teacher.classTeacher}" th:href="@{/discussions}" class="btn btn-outline">
                    <i class="bi bi-people-fill"></i> Class Discussion</a>
                <a th:href="@{/teacher/comms/new}" class="btn btn-primary"><i class="bi bi-megaphone-fill"></i> New Notice</a>
            </div>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <table class="wsims-table">
                <thead><tr><th>Subject</th><th>Category</th><th>Class</th><th>Recipients</th><th>Sent</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${broadcasts}">
                    <td th:text="${b.subject() != null and b.subject() != ''} ? ${b.subject()} : '(no subject)'">Subject</td>
                    <td><span class="status" th:classappend="${#strings.toLowerCase(b.category())}" th:text="${b.category()}">CATEGORY</span></td>
                    <td th:text="${b.targetScope()}">CLASS</td>
                    <td th:text="${b.recipientCount()}">0</td>
                    <td th:text="${b.sentAt()}">2026-01-01</td>
                    <td><a th:href="@{/comms/broadcasts/{id}/edit(id=${b.broadcastId()})}" class="btn btn-outline" style="padding:4px 10px; font-size:12px;">
                        <i class="bi bi-pencil-square"></i> Edit</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(broadcasts)}">
                    <td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i> No class notices posted yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
