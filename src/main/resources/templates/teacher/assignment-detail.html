<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${assignment.title} + ' · SISA'">Assignment · SISA</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('timetable')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1 th:text="${assignment.title}">Title</h1>
                <p><span th:text="${assignment.className}">Class</span> &middot; <span th:text="${assignment.subject}">Subject</span>
                    &middot; Due <span th:text="${assignment.dueDate}">2026-01-01</span></p>
            </div>
            <a th:href="@{/teacher/assignments}" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Back to Assignments</a>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card" style="margin-bottom:18px;">
            <p th:if="${assignment.description}" th:text="${assignment.description}">Description</p>
            <p th:if="${assignment.materialUrl}">Material: <a th:href="${assignment.materialUrl}" th:text="${assignment.materialUrl}" target="_blank" rel="noopener">link</a></p>
            <form th:action="@{/teacher/assignments/{id}/close(id=${assignment.id})}" method="post" style="display:inline;">
                <input type="hidden" name="closed" th:value="${!assignment.submissionsClosed}"/>
                <button type="submit" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;">
                    <i class="bi" th:classappend="${assignment.submissionsClosed} ? 'bi-unlock-fill' : 'bi-lock-fill'"></i>
                    <span th:text="${assignment.submissionsClosed} ? 'Reopen Submissions' : 'Close Submissions'">Close Submissions</span>
                </button>
            </form>
        </div>

        <div class="card">
            <h3><i class="bi bi-people-fill"></i> Submissions</h3>
            <table class="wsims-table">
                <thead>
                <tr><th>Student</th><th>Submitted</th><th>Status</th><th>Answer</th><th>Grade &amp; Feedback</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${submissions}">
                    <td>
                        <span th:text="${s.student.user.fullName}">Name</span>
                        &nbsp;<span class="id-badge" th:text="${s.student.studentId}">S2600001</span>
                    </td>
                    <td th:text="${#temporals.format(s.submittedAt, 'd MMM yyyy, h:mm a')}">4 Oct 2026, 3:04 AM</td>
                    <td><span class="status" th:classappend="${#strings.toLowerCase(s.status)}" th:text="${s.status}">STATUS</span></td>
                    <td th:text="${s.fileUrlOrText}">Answer</td>
                    <td>
                        <div th:if="${s.grade != null}" class="graded-view" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                            <strong th:if="${s.marks != null}" th:text="${#numbers.formatDecimal(s.marks, 1, 'COMMA', (s.marks % 1 == 0 ? 0 : 1), 'POINT')} + ' / 100'">78 / 100</strong>
                            <span class="status" th:classappend="${#strings.toLowerCase(s.grade)}" th:text="${s.grade}">A</span>
                            <button type="button" class="btn btn-outline js-edit-grade" style="padding:3px 8px; font-size:11px;" title="Edit marks"><i class="bi bi-pencil-square"></i> Edit</button>
                            <p th:if="${s.feedback != null and s.feedback != ''}" style="flex-basis:100%; font-size:12.5px; opacity:.7; margin:0;" th:text="${s.feedback}">Feedback</p>
                        </div>
                        <form th:action="@{/teacher/assignments/{id}/grade(id=${assignment.id})}" method="post" class="grade-form"
                              th:style="${s.grade != null} ? 'display:none; gap:6px; flex-wrap:wrap; align-items:center;' : 'display:flex; gap:6px; flex-wrap:wrap; align-items:center;'">
                            <input type="hidden" name="submissionId" th:value="${s.id}"/>
                            <input type="number" name="marks" min="0" max="100" step="0.5" placeholder="Marks /100" class="js-marks"
                                   th:value="${s.marks}" style="width:110px; padding:6px;" required/>
                            <span class="status js-grade-preview" style="min-width:24px; text-align:center;">–</span>
                            <input type="text" name="feedback" placeholder="Feedback" th:value="${s.feedback}" style="width:auto; padding:6px;"/>
                            <button type="submit" class="btn btn-primary" style="padding:6px 12px; font-size:12.5px;">Save</button>
                            <button th:if="${s.grade != null}" type="button" class="btn btn-outline js-cancel-grade" style="padding:6px 12px; font-size:12.5px;">Cancel</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(submissions)}">
                    <td colspan="5"><div class="empty-state"><i class="bi bi-inbox"></i> No submissions yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
    (function () {
        function gradeFor(m) {
            if (m >= 75) return 'A';
            if (m >= 60) return 'B';
            if (m >= 50) return 'C';
            if (m >= 40) return 'D';
            return 'F';
        }
        document.querySelectorAll('.grade-form').forEach(function (form) {
            var input = form.querySelector('.js-marks');
            var preview = form.querySelector('.js-grade-preview');
            function update() {
                var v = parseFloat(input.value);
                var g = isNaN(v) || v < 0 || v > 100 ? '–' : gradeFor(v);
                preview.textContent = g;
                preview.className = 'status js-grade-preview' + (g === '–' ? '' : ' ' + g.toLowerCase());
            }
            input.addEventListener('input', update);
            update();
            var cancel = form.querySelector('.js-cancel-grade');
            if (cancel) cancel.addEventListener('click', function () {
                form.style.display = 'none';
                form.previousElementSibling.style.display = 'flex';
            });
        });
        document.querySelectorAll('.js-edit-grade').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var view = btn.closest('.graded-view');
                view.style.display = 'none';
                view.nextElementSibling.style.display = 'flex';
            });
        });
    })();
</script>
</body>
</html>
