<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Teachers · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('access')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Teachers</h1>
                <p>Create Teacher accounts and assign each one a subject specialty and, if they're a Class Teacher, a class.</p>
            </div>
            <a th:if="${user.role.name() == 'REGISTRAR'}" th:href="@{/registrar/teachers/new}" class="btn btn-primary"><i class="bi bi-person-plus-fill"></i> New Teacher</a>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <table class="wsims-table" th:if="${not #lists.isEmpty(teachers)}">
                <thead><tr><th>ID</th><th>Name</th><th>Subject Specialty</th><th>Class Teacher Of</th><th>Login</th><th></th></tr></thead>
                <tbody>
                <tr th:each="t : ${teachers}">
                    <td><span class="id-badge" th:text="${t.teacherId}">T2600001</span></td>
                    <td th:text="${t.user.fullName}">Name</td>
                    <td th:text="${t.subjectSpecialty} ?: '—'">Subject</td>
                    <td th:text="${t.classTeacher and t.assignedClassName != null} ? ${t.assignedClassName} : '—'">Class</td>
                    <td><span class="status" th:classappend="${#strings.toLowerCase(t.user.status)}" th:text="${t.user.status}">STATUS</span></td>
                    <td>
                        <div style="display:flex; gap:8px; justify-content:flex-end;">
                            <a th:href="@{/registrar/teachers/{id}(id=${t.teacherId})}" class="btn btn-outline" style="padding:5px 10px; font-size:12px;"><i class="bi bi-pencil-fill"></i> Assign</a>
                            <form th:action="@{/registrar/teachers/{id}/delete(id=${t.teacherId})}" method="post" style="margin:0;" class="confirm-delete"
                                  th:data-confirm="|Permanently delete teacher ${t.teacherId} (${t.user.fullName})? This cannot be undone.|">
                                <button type="submit" class="btn btn-danger" style="padding:5px 10px; font-size:12px;">
                                    <i class="bi bi-trash-fill"></i> Delete
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="empty-state" th:if="${#lists.isEmpty(teachers)}">
                <i class="bi bi-inbox"></i> No teachers yet — create the first one.
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
    document.querySelectorAll('form.confirm-delete').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            if (!confirm(form.dataset.confirm || 'Permanently delete this teacher?')) e.preventDefault();
        });
    });
</script>
</body>
</html>
