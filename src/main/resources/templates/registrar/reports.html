<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reports · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('reports')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>Reports</h1>
            <p>Enrolment, transfer, class list and staff directory &mdash; export as PDF or Excel.</p>
        </div>

        <div class="card" style="margin-bottom:18px;">
            <form th:action="@{/registrar/reports}" method="get" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
                <div class="field" style="margin-bottom:0; min-width:200px;">
                    <label for="type">Report</label>
                    <select id="type" name="type">
                        <option th:each="t : ${reportTypes}" th:value="${t}" th:text="${t}" th:selected="${t == selectedType}">TYPE</option>
                    </select>
                </div>
                <div class="field" style="margin-bottom:0;">
                    <label for="from">From</label>
                    <input id="from" type="date" name="from" th:value="${from}"/>
                </div>
                <div class="field" style="margin-bottom:0;">
                    <label for="to">To</label>
                    <input id="to" type="date" name="to" th:value="${to}"/>
                </div>
                <div class="field" style="margin-bottom:0; min-width:180px;">
                    <label for="className">Class (Class List)</label>
                    <select id="className" name="className">
                        <option value="">—</option>
                        <option th:each="c : ${allClassNames}" th:value="${c}" th:text="${c}" th:selected="${c == className}">Class</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-outline"><i class="bi bi-search"></i> View</button>
            </form>
        </div>

        <div th:replace="~{layout/saved-reports :: card}"></div>

        <div class="card" style="margin-bottom:18px;" th:if="${chart != null and not #lists.isEmpty(chart.labels())}">
            <canvas id="reportChart" height="220"></canvas>
            <script th:inline="javascript">
                /*<![CDATA[*/
                (function () {
                    var chart = /*[[${chart}]]*/ {};
                    new Chart(document.getElementById('reportChart'), {
                        type: chart.chartType,
                        data: {
                            labels: chart.labels,
                            datasets: [{
                                label: chart.seriesLabel,
                                data: chart.values,
                                backgroundColor: chart.chartType === 'bar' ? '#0B2E4F' : 'rgba(232,132,60,0.15)',
                                borderColor: '#E8843C',
                                tension: 0.3,
                                fill: chart.chartType === 'line'
                            }]
                        },
                        options: { plugins: { legend: { display: false } } }
                    });
                })();
                /*]]>*/
            </script>
        </div>

        <div class="card">
            <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
                <h3 style="margin:0;" th:text="${report.title()}">Report</h3>
                <div style="display:flex; gap:10px;">
                    <a th:href="@{/registrar/reports/export(type=${selectedType},format='pdf',from=${from},to=${to},className=${className})}" class="btn btn-outline"><i class="bi bi-file-earmark-pdf-fill"></i> Export as PDF</a>
                    <a th:href="@{/registrar/reports/export(type=${selectedType},format='excel',from=${from},to=${to},className=${className})}" class="btn btn-outline"><i class="bi bi-file-earmark-excel-fill"></i> Export as Excel</a>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table class="wsims-table">
                    <thead>
                    <tr><th th:each="c : ${report.columns()}" th:text="${c}">Column</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${report.rows()}">
                        <td th:each="cell : ${row}" th:text="${cell}">Cell</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(report.rows())}">
                        <td th:attr="colspan=${#lists.size(report.columns())}"><div class="empty-state"><i class="bi bi-inbox"></i> No data for this report yet.</div></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
