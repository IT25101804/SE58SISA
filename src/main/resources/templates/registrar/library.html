<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Library · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('library')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>Library</h1>
            <p>Catalog and loans (School Resources &amp; Facilities Management module).</p>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="grid grid-2">
            <div class="card">
                <h3><i class="bi bi-book-half"></i> Catalog</h3>
                <table class="wsims-table" th:if="${not #lists.isEmpty(items)}">
                    <thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Available</th></tr></thead>
                    <tbody>
                    <tr th:each="i : ${items}">
                        <td th:text="${i.title}">Title</td>
                        <td th:text="${i.author} ?: '—'">Author</td>
                        <td th:text="${i.category} ?: '—'">Category</td>
                        <td th:text="${i.availableCopies} + ' / ' + ${i.totalCopies}">1 / 1</td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(items)}">
                    <i class="bi bi-inbox"></i> No library items yet.
                </div>

                <form th:action="@{/registrar/library/items}" method="post" style="margin-top:14px;">
                    <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" required/></div>
                    <div class="field"><label for="author">Author (optional)</label><input id="author" name="author" type="text"/></div>
                    <div class="field"><label for="category">Category (optional)</label><input id="category" name="category" type="text" placeholder="e.g. Fiction"/></div>
                    <div class="field"><label for="totalCopies">Copies</label><input id="totalCopies" name="totalCopies" type="number" min="1" value="1"/></div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle-fill"></i> Add to Catalog</button>
                </form>
            </div>

            <div class="card">
                <h3><i class="bi bi-arrow-left-right"></i> Active Loans</h3>
                <table class="wsims-table" th:if="${not #lists.isEmpty(activeLoans)}">
                    <thead><tr><th>Item</th><th>Student</th><th>Due</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="l : ${activeLoans}">
                        <td th:text="${l.libraryItem.title}">Title</td>
                        <td th:text="${l.student.studentId}">S2600001</td>
                        <td th:text="${l.dueDate}">2026-01-01</td>
                        <td>
                            <form th:action="@{/registrar/library/loans/{id}/return(id=${l.id})}" method="post">
                                <button type="submit" class="btn btn-outline" style="padding:4px 10px; font-size:12px;">Mark Returned</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(activeLoans)}">
                    <i class="bi bi-inbox"></i> No active loans.
                </div>

                <form th:action="@{/registrar/library/loans}" method="post" style="margin-top:14px;">
                    <div class="field"><label for="libraryItemId">Item</label>
                        <select id="libraryItemId" name="libraryItemId" required>
                            <option value="">Select…</option>
                            <option th:each="i : ${items}" th:value="${i.id}"
                                    th:text="${i.title} + ' (' + ${i.availableCopies} + ' available)'"
                                    th:disabled="${i.availableCopies == 0}">Title</option>
                        </select>
                    </div>
                    <div class="field"><label for="studentId">Student ID</label>
                        <input id="studentId" name="studentId" type="text" placeholder="e.g. S2600001" required/>
                    </div>
                    <div class="field"><label for="dueDate">Due Date</label>
                        <input id="dueDate" name="dueDate" type="date" required/>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i> Issue Loan</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
