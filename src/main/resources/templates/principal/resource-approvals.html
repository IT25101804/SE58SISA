<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Booking Approvals · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('resources')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Booking Approvals</h1>
                <p>Requests waiting on a decision. Resources marked auto-approve never appear here.</p>
            </div>
            <a th:href="@{/resources/availability}" class="btn btn-outline"><i class="bi bi-grid-3x3-gap-fill"></i> Availability &rarr;</a>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <table class="wsims-table" th:if="${not #lists.isEmpty(pendingBookings)}">
                <thead><tr><th>Resource</th><th>Requested By</th><th>Date</th><th>Period</th><th>Purpose</th><th>Requested At</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${pendingBookings}">
                    <td th:text="${b.resource.name}">Room</td>
                    <td th:text="${b.bookedByUserId}">T2600001</td>
                    <td th:text="${b.bookingDate}">2026-09-14</td>
                    <td th:text="'Period ' + ${b.periodNumber}">Period 1</td>
                    <td th:text="${b.purpose}">Purpose</td>
                    <td th:text="${#temporals.format(b.requestedAt, 'dd MMM yyyy HH:mm')}">14 Sep 2026 10:00</td>
                    <td style="display:flex; gap:6px;">
                        <form th:action="@{/principal/resources/approvals/{id}/approve(id=${b.id})}" method="post">
                            <button type="submit" class="btn btn-primary" style="padding:5px 10px; font-size:12px;"><i class="bi bi-check-lg"></i> Approve</button>
                        </form>
                        <form th:action="@{/principal/resources/approvals/{id}/reject(id=${b.id})}" method="post">
                            <button type="submit" class="btn btn-outline" style="padding:5px 10px; font-size:12px;"><i class="bi bi-x-lg"></i> Reject</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="empty-state" th:if="${#lists.isEmpty(pendingBookings)}">
                <i class="bi bi-check2-circle"></i> Nothing waiting on a decision right now.
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
