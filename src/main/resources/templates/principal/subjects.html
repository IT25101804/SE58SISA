<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Subjects · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('subjects')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head">
            <h1>Subjects</h1>
            <p>The school's official subject list (Academic Management module).</p>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="grid grid-2">
            <div class="card">
                <h3><i class="bi bi-collection-fill"></i> Subjects</h3>
                <table class="wsims-table" th:if="${not #lists.isEmpty(subjects)}">
                    <thead><tr><th>Name</th><th>Code</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${subjects}">
                        <td th:text="${s.name}">Mathematics</td>
                        <td th:text="${s.code} ?: '—'">MATH</td>
                        <td>
                            <form th:action="@{/principal/subjects/{id}/delete(id=${s.id})}" method="post">
                                <button type="submit" class="btn btn-danger" style="padding:4px 10px; font-size:12px;"
                                        onclick="return confirm('Delete this subject? This cannot be undone.');">
                                    <i class="bi bi-trash-fill"></i> Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty-state" th:if="${#lists.isEmpty(subjects)}">
                    <i class="bi bi-inbox"></i> No subjects registered yet.
                </div>
            </div>

            <div class="card" style="align-self:start;">
                <h3><i class="bi bi-plus-circle-fill"></i> Register a Subject</h3>
                <form th:action="@{/principal/subjects}" method="post">
                    <div class="field"><label for="subjectName">Subject Name</label>
                        <input id="subjectName" name="name" type="text" placeholder="e.g. Mathematics" required/>
                    </div>
                    <div class="field"><label for="subjectCode">Code (optional)</label>
                        <input id="subjectCode" name="code" type="text" placeholder="e.g. MATH"/>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-plus-circle-fill"></i> Register Subject</button>
                </form>
            </div>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
