<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Communication · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <script>try{if(localStorage.getItem('wsims-theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body>
<div class="app-shell">
    <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div th:replace="~{layout/sidebar :: backdrop}"></div>

    <main class="content">
        <div class="page-head" style="display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <h1>Communication</h1>
                <p>Every message sent school-wide, from anyone.</p>
            </div>
            <div style="display:flex; gap:10px;">
                <a th:href="@{/inbox}" class="btn btn-outline"><i class="bi bi-inbox-fill"></i> My Inbox</a>
                <a th:href="@{/principal/comms/new}" class="btn btn-primary"><i class="bi bi-send-fill"></i> New Message</a>
            </div>
        </div>

        <div th:if="${success}" class="alert success"><i class="bi bi-check-circle-fill"></i> <span th:text="${success}">Done</span></div>
        <div th:if="${error}" class="alert error"><i class="bi bi-exclamation-circle-fill"></i> <span th:text="${error}">Error</span></div>

        <div class="card">
            <table class="wsims-table">
                <thead><tr><th>Subject</th><th>Category</th><th>Scope</th><th>From</th><th>Recipients</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${broadcasts}">
                    <td th:text="${b.subject() != null and b.subject() != ''} ? ${b.subject()} : '(no subject)'">Subject</td>
                    <td><span class="status" th:classappend="${#strings.toLowerCase(b.category())}" th:text="${b.category()}">CATEGORY</span></td>
                    <td th:text="${b.targetScope()}">SCOPE</td>
                    <td th:text="${b.senderUserId()}">Sender</td>
                    <td th:text="${b.recipientCount()}">0</td>
                    <td>
                        <span th:if="${b.sentAt() != null}" class="status active">Sent</span>
                        <span th:unless="${b.sentAt() != null}" class="status pending">Scheduled</span>
                    </td>
                    <td>
                        <div style="display:flex; gap:6px; justify-content:flex-end;">
                            <a th:if="${b.sentAt() == null}" th:href="@{/comms/broadcasts/{id}/edit(id=${b.broadcastId()})}" class="btn btn-outline" style="padding:4px 10px; font-size:12px;">
                            <i class="bi bi-pencil-square"></i> Edit</a>
                            <form th:action="@{/comms/broadcasts/{id}/delete(id=${b.broadcastId()})}" method="post" style="margin:0;"
                              data-confirm="Delete this message for every recipient? This cannot be undone.">
                            <button type="submit" class="btn btn-danger" style="padding:4px 10px; font-size:12px;"><i class="bi bi-trash-fill"></i> Delete</button>
                        </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(broadcasts)}">
                    <td colspan="7"><div class="empty-state"><i class="bi bi-inbox"></i> Nothing sent yet.</div></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script th:src="@{/js/main.js}"></script>
<script th:inline="javascript">
    document.querySelectorAll('.delete-broadcast-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            if (!confirm(form.dataset.confirm || 'Delete this scheduled message?')) {
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
