<div th:fragment="view(reportCard)" xmlns:th="http://www.thymeleaf.org">
    <div class="rc-summary">
        <div class="rc-term">
            <i class="bi bi-calendar3"></i>
            <div>
                <strong th:text="${reportCard.term() != null} ? ${reportCard.term().name} : 'All terms'">Term 3, 2026</strong>
                <span th:if="${reportCard.term() != null}"
                      th:text="${#temporals.format(reportCard.term().startDate, 'd MMM yyyy')} + ' – ' + ${#temporals.format(reportCard.term().endDate, 'd MMM yyyy')}">7 Sep 2026 – 4 Dec 2026</span>
            </div>
        </div>
        <div class="rc-stats">
            <div>
                <span class="rc-value" th:text="${#lists.isEmpty(reportCard.entries())} ? '—'
                      : (${reportCard.totalMarks() % 1 == 0} ? ${#numbers.formatInteger(reportCard.totalMarks(), 1)} : ${#numbers.formatDecimal(reportCard.totalMarks(), 1, 1)})">—</span>
                <span class="rc-label">Total marks</span>
            </div>
            <div>
                <span class="rc-value" th:text="${reportCard.averageMark() != null} ? ${#numbers.formatDecimal(reportCard.averageMark(), 1, 1)} : '—'">—</span>
                <span class="rc-label">Average mark</span>
            </div>
            <div>
                <span class="rc-value" th:text="${#lists.size(reportCard.entries())}">0</span>
                <span class="rc-label">Exams</span>
            </div>
        </div>
    </div>
    <table class="wsims-table rc-table">
        <thead>
        <tr><th>Subject</th><th>Assessment</th><th>Date</th><th class="num">Marks</th><th class="num">%</th><th class="num">Grade</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${reportCard.entries()}">
            <td class="rc-subject" th:text="${e.subject()}">Mathematics</td>
            <td th:text="${e.examName()}">First Term Test</td>
            <td th:text="${#temporals.format(e.examDate(), 'd MMM yyyy')}">1 Apr 2026</td>
            <td class="num" th:text="${#numbers.formatDecimal(e.marksObtained(), 1, 0)} + ' / ' + ${#numbers.formatDecimal(e.maxMarks(), 1, 0)}">82 / 100</td>
            <td class="num" th:text="${e.maxMarks() > 0} ? ${#numbers.formatDecimal(e.marksObtained() * 100 / e.maxMarks(), 1, 0)} + '%' : '—'">82%</td>
            <td class="num"><span class="status" th:classappend="${#strings.toLowerCase(e.grade())}" th:text="${e.grade()}">A</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(reportCard.entries())}">
            <td colspan="6"><div class="empty-state"><i class="bi bi-inbox"></i> No exam results recorded for this term yet.</div></td>
        </tr>
        </tbody>
    </table>
    <p class="rc-scale">Grading scale: A 75–100% · B 60–74% · C 50–59% · D 40–49% · F below 40%</p>
</div>

<!-- Term picker: reloads the current page with ?termId=… -->
<form th:fragment="termPicker(terms, selectedTermId)" method="get" style="display:flex; gap:8px; align-items:center; margin:0;"
      xmlns:th="http://www.thymeleaf.org">
    <label for="termId" style="font-size:13px; font-weight:600; color:var(--navy);">Term</label>
    <select id="termId" name="termId" onchange="this.form.submit()"
            style="padding:8px 10px; border-radius:var(--radius-sm); border:1.5px solid var(--azure); font-family:inherit; font-size:14px; background:var(--white); color:var(--charcoal);">
        <option th:each="t : ${terms}" th:value="${t.id}" th:selected="${t.id == selectedTermId}"
                th:text="${t.name} + (${t.current} ? ' (current)' : '')">Term</option>
    </select>
</form>
