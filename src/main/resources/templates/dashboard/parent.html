<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parent Dashboard · WSIMS</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <div th:replace="~{layout/sidebar :: sidebar('comm')}"></div>
  <div th:replace="~{layout/topbar :: topbar}"></div>
  <div th:replace="~{layout/sidebar :: backdrop}"></div>
  <main class="content">
    <div class="page-head">
      <h1>Following your child's progress</h1>
      <p>Attendance, results, and school announcements &mdash; all in one view.</p>
    </div>
    <div class="grid grid-3" style="margin-bottom:20px;">
      <div class="card stat-card">
        <div class="stat-icon"><i class="bi bi-calendar2-check-fill"></i></div>
        <div class="stat-value" th:text="${childAttendancePercentage != null} ? ${#numbers.formatDecimal(childAttendancePercentage,1,1)} + '%' : '—'">—</div>
        <div class="stat-label">Child's Attendance %</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon"><i class="bi bi-award-fill"></i></div>
        <div class="stat-value">—</div>
        <div class="stat-label">Latest Term GPA</div>
      </div>
      <div class="card stat-card">
        <div class="stat-icon"><i class="bi bi-bell-fill"></i></div>
        <div class="stat-value" th:text="${unreadAlertsCount != null} ? ${unreadAlertsCount} : '—'">—</div>
        <div class="stat-label">Unread Alerts</div>
      </div>
    </div>
    <div class="card">
      <h3 style="display:flex; align-items:center; justify-content:space-between;">
        <span><i class="bi bi-megaphone-fill"></i> Recent Announcements</span>
        <a th:href="@{/inbox}" class="btn btn-outline" style="padding:6px 12px; font-size:12.5px;">Full Inbox &rarr;</a>
      </h3>
      <table class="wsims-table" th:if="${not #lists.isEmpty(recentAnnouncements)}">
        <thead><tr><th></th><th>Subject</th><th>Category</th><th>Received</th></tr></thead>
        <tbody>
        <tr th:each="n : ${recentAnnouncements}">
          <td><span class="status" th:classappend="${n.read} ? 'read' : 'unread'" th:text="${n.read} ? 'Read' : 'Unread'">Unread</span></td>
          <td><a th:href="@{/inbox/{id}(id=${n.id})}" th:text="${n.subject != null and n.subject != ''} ? ${n.subject} : '(no subject)'">Subject</a></td>
          <td><span class="status" th:classappend="${#strings.toLowerCase(n.category)}" th:text="${n.category}">CATEGORY</span></td>
          <td th:text="${n.sentAt}">2026-01-01</td>
        </tr>
        </tbody>
      </table>
      <div class="empty-state" th:if="${#lists.isEmpty(recentAnnouncements)}">
        <i class="bi bi-inbox"></i>
        No announcements yet.
      </div>
    </div>
  </main>
</div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
